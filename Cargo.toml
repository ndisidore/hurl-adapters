[workspace]
resolver = "2"
members = [
    "hurl-adapters-lib",
    "hurl-adapters-cli",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
